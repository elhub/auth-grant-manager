ktor:
  application:
    modules:
      - no.elhub.auth.common.ApplicationModuleKt.module
      - no.elhub.auth.v0.features.common.CommonModuleKt.commonModule
      - no.elhub.auth.v0.features.featuretoggles.ModuleKt.unleashModule
      - no.elhub.auth.v0.features.common.CommonModuleKt.personServiceModule
      - no.elhub.auth.v0.features.businessprocesses.datasharing.StromprisServiceModuleKt.stromprisServiceModule
      - no.elhub.auth.v0.features.businessprocesses.ediel.EdielServiceModuleKt.edielServiceModule
      - no.elhub.auth.v0.features.businessprocesses.structuredata.meteringpoints.MeteringPointsServiceModuleKt.meteringPointsServiceModule
      - no.elhub.auth.v0.features.businessprocesses.structuredata.organisations.OrganisationsServiceModuleKt.organisationsServiceModule
      - no.elhub.auth.v0.features.businessprocesses.BusinessProcessesModuleKt.businessProcessesModule
      - no.elhub.auth.v0.features.openapi.ModuleKt.module
      - no.elhub.auth.v0.features.grants.ModuleKt.module
      - no.elhub.auth.v0.features.documents.ModuleKt.module
      - no.elhub.auth.v0.features.requests.ModuleKt.module
      - no.elhub.auth.v1.features.documents.ModuleKt.module
      - no.elhub.auth.v0.features.common.ModuleKt.module
  deployment:
    port: 8080
  database:
    url: '$JDBC_URL'
    driverClass: 'org.postgresql.Driver'
    username: '$APP_USERNAME'
    password: '$APP_PASSWORD'
    hikari:
      maximumPoolSize: 10

pdfGenerator:
  mustacheResourcePath: 'templates'
  useTestPdfNotice: ${USE_PDF_TEST_NOTICE:false}

v1:
  enabled: ${V1_ENABLED:false}

pdfSigner:
  # HashiCorp Vault settings
  vault:
    url: $VAULT_URL
    key: $VAULT_KEY
    tokenPath: $VAULT_TOKEN_PATH
  certificate:
    signing: $PATH_TO_SIGNING_CERTIFICATE
    intermediate: $PATH_TO_INTERMEDIATE_CERTIFICATE
    bankIdRootDir: $PATH_TO_BANKID_ROOT_CERTIFICATES_DIR
    tsaRootDir: $PATH_TO_TSA_ROOT_CERTIFICATES_DIR

pdp:
  baseUrl: ${PDP_BASE_URL}

authPersons:
  baseUri: ${AUTH_PERSONS_URL}
  idp:
    clientId: ${AUTH_PERSONS_IDP_CLIENT_ID}
    clientSecret: ${AUTH_PERSONS_IDP_CLIENT_SECRET}

structureData:
  meteringPointsService:
    serviceUrl: ${STRUCTURE_DATA_METERING_POINTS_SERVICE_URL}
    idp:
      clientId: ${STRUCTURE_DATA_METERING_POINTS_SERVICE_IDP_CLIENT_ID}
      clientSecret: ${STRUCTURE_DATA_METERING_POINTS_SERVICE_IDP_CLIENT_SECRET}
  organisationsService:
    serviceUrl: ${STRUCTURE_DATA_ORGANISATIONS_SERVICE_URL}
    authentication:
      basic:
        username: ${STRUCTURE_DATA_ORGANISATIONS_SERVICE_API_USERNAME}
        password: ${STRUCTURE_DATA_ORGANISATIONS_SERVICE_API_PASSWORD}

dataSharing:
  stromprisService:
    serviceUrl: ${STROMPRIS_SERVICE_URL}
    idp:
      clientId: ${STROMPRIS_SERVICE_IDP_CLIENT_ID}
      clientSecret: ${STROMPRIS_SERVICE_IDP_CLIENT_SECRET}
  validateContractNameFeature: ${VALIDATE_CONTRACT_NAME_FEATURE}

idp:
  tokenUrl: ${IDP_TOKEN_URL}

httpProxy:
  url: ${HTTP_PROXY_URL:}

unleash:
  enabled: ${UNLEASH_ENABLED:false}
  url: ${UNLEASH_API_URL:}
  apiToken: ${UNLEASH_API_TOKEN:}
  appName: auth-grant-manager

ediel:
  validateRedirectUriFeature: ${VALIDATE_REDIRECT_URI_FEATURE:true}
  environment: ${EDIEL_ENV:production}
  serviceUrl: ${EDIEL_SERVICE_URL:https://ws.ediel.no/api}
  authentication:
    basic:
      username: ${EDIEL_USERNAME}
      password: ${EDIEL_PASSWORD}
