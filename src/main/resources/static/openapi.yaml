---
openapi: 3.1.1
info:
  title: Access API
  version: 0.1.0
  description: >
    The Authorization Grant Manager provides APIs for creating, managing, and retrieving authorization
    documents, authorization grants, and authorization requests used within Elhub's access control
    ecosystem.

    Note: The authorization-grant APIs are under active development. Schemas and parameters may still
    change.
  x-status: Development
  contact:
    name: team-devxp
  license:
    name: MIT
    url: https://github.com/elhub/auth-grant-manager?tab=MIT-1-ov-file

servers:
  - url: https://api.elhub.no
    description: Production
  - url: https://api-mt1.elhub.no
    description: MT1

tags:
  - name: Authorization Documents
    description: Operations for creating, retrieving, managing, and submitting authorization documents.
  - name: Authorization Grants
    description: Operations for listing and retrieving authorization grants and their scopes.
  - name: Authorization Requests
    description: Operations for creating, retrieving, and managing authorization requests.
  - name: Work in Progress
    description: Endpoints under development and not yet part of the stable API contract.

security:
  - bearerAuth: []

paths:
  '/access/v0/authorization-documents':
    get:
      tags:
        - Authorization Documents
      summary: List authorization documents
      description: >
        Retrieve a list of authorization document objects available to the calling party.
        The result is constrained by the caller's authorization context.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: page[number]
          in: query
          required: false
          description: Zero-based page number. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: page[size]
          in: query
          required: false
          description: Number of items per page. Defaults to 100, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: A list of authorization document objects.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/documents/authorization-document-collection.schema.json'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    post:
      tags:
        - Authorization Documents
      summary: Create authorization document for signing
      description: >
        Create a new authorization document that will later be signed by the appropriate party.
        The response includes the identifier of the document and links to the document resource
        and its generated PDF file.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: './schemas/documents/authorization-document-submission.schema.json'
      responses:
        '201':
          description: >
            The authorization document was created successfully. The response includes the
            identifier of the new document and links to the resource and its PDF representation.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/documents/authorization-document-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaTypeError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-documents/{id}':
    get:
      tags:
        - Authorization Documents
      summary: Get authorization document by id
      description: >
        Retrieve information about a specific authorization document. This can be used to
        check the document status and other attributes such as involved parties and validity.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization document to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Details of the requested authorization document.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/documents/authorization-document-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-documents/{id}.pdf':
    get:
      tags:
        - Authorization Documents
      summary: Download authorization document PDF
      description: >
        Retrieve the PDF representation of an authorization document. The PDF reflects the
        current state of the document at the time of retrieval.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization document whose PDF should be retrieved.
          schema:
            type: string
      responses:
        '200':
          description: The PDF file representing the authorization document. Error responses are returned as application/vnd.api+json.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      tags:
        - Authorization Documents
      summary: Submit signed authorization document
      description: >
        Submit a signed authorization document as a PDF file. Elhub validates the signature,
        generates any required authorization grants, and stores the document if the validation succeeds.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization document to be submitted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: >
            The signature was successfully validated and the document was registered and accepted.
            No content is returned in the response body.
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '413':
          $ref: '#/components/responses/413ContentTooLargeError'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaTypeError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-grants':
    get:
      tags:
        - Authorization Grants
      summary: List authorization grants
      description: >
        Retrieve a list of authorization grants available to the caller. The result is constrained
        by the caller's token and GLN context. Results are returned ordered by createdAt DESC
        (newest first) and support offset-based pagination.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUser'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: page[number]
          in: query
          required: false
          description: Zero-based page number. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: page[size]
          in: query
          required: false
          description: Number of items per page. Defaults to 100, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: A list of authorization grants.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/grants/authorization-grant-collection.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-grants/{id}':
    get:
      tags:
        - Authorization Grants
      summary: Get authorization grant by id
      description: >
        Retrieve a specific authorization grant by its identifier.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUserOptional'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization grant to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: The requested authorization grant.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/grants/authorization-grant-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    patch:
      tags:
        - Authorization Grants
      summary: Update authorization grant status
      description: >
        Update the status of an authorization grant. This endpoint is intended for internal
        Elhub systems (BRS) and is not available to external integrators.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization grant to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: './schemas/grants/authorization-grant-update.schema.json'
      responses:
        '200':
          description: The authorization grant was successfully updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/grants/authorization-grant-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-grants/{id}/scopes':
    get:
      tags:
        - Authorization Grants
      summary: List scopes for authorization grant
      description: >
        Retrieve all scopes associated with a specific authorization grant.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUser'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization grant whose scopes should be retrieved.
          schema:
            type: string
      responses:
        '200':
          description: A list of authorization scopes associated with the grant.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/grants/authorization-scope-collection.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-requests':
    get:
      tags:
        - Authorization Requests
      summary: List authorization requests
      description: >
        Retrieve a list of authorization requests. The result is constrained by the caller's
        token and, where applicable, GLN context. Results are returned ordered by createdAt DESC
        (newest first) and support offset-based pagination.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUser'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: filter[status]
          in: query
          required: false
          description: >
            Filter results by one or more statuses. When omitted, requests of all statuses are returned.
            Multiple statuses can be specified as a comma-separated list (e.g. `filter[status]=Pending,Expired`).
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: './schemas/requests/authorization-request-common.schema.json#/$defs/authorizationRequestStatus'
        - name: page[number]
          in: query
          required: false
          description: Zero-based page number. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: page[size]
          in: query
          required: false
          description: Number of items per page. Defaults to 100, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: A list of authorization requests.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/requests/authorization-request-collection.schema.json'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    post:
      tags:
        - Authorization Requests
      summary: Create authorization request for MinSide
      description: >
        Initiate a new authorization request flow. This creates an authorization request that
        is associated with a user in MinSide and returns the created authorization request,
        including its ID, which can be used to start the Elhub Min Side flow.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: './schemas/requests/authorization-request-submission.schema.json'
      responses:
        '201':
          description: >
            The authorization request was created and the response contains details of the
            request, including the authorization request ID used to start the Elhub Min Side flow
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/requests/authorization-request-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaTypeError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v0/authorization-requests/{id}':
    get:
      tags:
        - Authorization Requests
      summary: Get authorization request by id
      description: >
        Retrieve information about a specific authorization request. This can be used to
        check the status of the request.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUser'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization request to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Details of the requested authorization request.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/requests/authorization-request-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    patch:
      tags:
        - Authorization Requests
      summary: Update authorization request
      description: >
        Update an authorization request. This endpoint is intended for internal MinSide usage
        with an end-user token and is not available to external integrators.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - name: Authorization
          in: header
          required: true
          description: End-user bearer token associated with the MinSide user.
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization request to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: './schemas/requests/authorization-request-update.schema.json'
      responses:
        '200':
          description: The authorization request was successfully updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: './schemas/requests/authorization-request-resource.schema.json'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v1/authorization-documents':
    post:
      tags:
        - Work in Progress
      summary: '[WIP] Create an authorization document for signing'
      description: Create an authorization document for signing.
      operationId: createV1AuthorizationDocument
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/V1AuthorizationDocumentSubmission'
            examples:
              changeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationSubmission'
              moveInAndChangeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationSubmission'
      responses:
        '201':
          description: The authorization document was created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationDocumentResource'
              examples:
                changeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationSubmissionResponse'
                moveInAndChangeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationSubmissionResponse'

  '/access/v1/authorization-documents/{id}':
    get:
      tags:
        - Work in Progress
      summary: '[WIP] Get an authorization document by ID'
      description: Get an authorization document by ID.
      operationId: getV1AuthorizationDocument
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization document to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested authorization document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationDocumentResource'
              examples:
                changeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationGetResponse'
                moveInAndChangeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationGetResponse'

  '/access/v1/authorization-grants/{id}':
    get:
      tags:
        - Work in Progress
      summary: '[WIP] Get an authorization grant by ID'
      description: Get an authorization grant and its permissions.
      operationId: getV1AuthorizationGrant
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUserOptional'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization grant to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested authorization grant.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationGrantResource'
              examples:
                changeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationGrantResponse'
                moveInAndChangeOfEnergySupplierForOrganization:
                  $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationGrantResponse'

  '/access/v1/authorization-requests':
    post:
      tags:
        - Work in Progress
      summary: '[WIP] Create an authorization request for approval'
      description: Create an authorization request for approval.
      operationId: createV1AuthorizationRequest
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinporten'
        - $ref: '#/components/parameters/SenderGlnRequired'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/V1AuthorizationRequestSubmission'
            examples:
              changeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1ChangeOfEnergySupplierForOrganizationRequestSubmission'
              moveInAndChangeOfEnergySupplierForOrganization:
                $ref: '#/components/examples/V1MoveInAndChangeOfEnergySupplierForOrganizationRequestSubmission'
      responses:
        '201':
          description: A Pending authorization request.
          headers:
            Location:
              description: URI of the created authorization request, also returned as links.self.
              schema:
                type: string
                format: uri-reference
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationRequestResource'
              examples:
                pending:
                  $ref: '#/components/examples/V1AuthorizationRequestPendingResponse'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '409':
          $ref: '#/components/responses/409ConflictError'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaTypeError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  '/access/v1/authorization-requests/{id}':
    get:
      tags:
        - Work in Progress
      summary: '[WIP] Get an authorization request by ID'
      description: Get an authorization request by ID.
      operationId: getV1AuthorizationRequest
      x-status: Work in progress
      x-availability: Not deployed to Production or MT1
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/AuthorizationMaskinportenOrEndUser'
        - $ref: '#/components/parameters/SenderGlnOptional'
        - $ref: '#/components/parameters/OnBehalfOfGlnOptional'
        - name: id
          in: path
          required: true
          description: Unique identifier of the authorization request to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The authorization request, including its current approval outcome.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/V1AuthorizationRequestResource'
              examples:
                pending:
                  $ref: '#/components/examples/V1AuthorizationRequestPendingResponse'
                accepted:
                  $ref: '#/components/examples/V1AuthorizationRequestAcceptedResponse'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '401':
          $ref: '#/components/responses/401UnauthorizedError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '406':
          $ref: '#/components/responses/406NotAcceptableError'
        '500':
          $ref: '#/components/responses/500InternalServerError'

