  schemas:
    V1AuthorizationRequestSubmission:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - type
            - attributes
            - meta
          properties:
            type:
              type: string
              const: AuthorizationRequest
            attributes:
              $ref: '#/components/schemas/V1AuthorizationRequestSubmissionAttributes'
              unevaluatedProperties: false
            meta:
              type: object
              additionalProperties: false
              required:
                - requestedFrom
                - requestedTo
                - language
              properties:
                requestedFrom:
                  $ref: '#/components/schemas/V1AuthorizationDocumentMeta/properties/requestedFrom'
                requestedTo:
                  $ref: '#/components/schemas/V1AuthorizationDocumentMeta/properties/requestedTo'
                language:
                  $ref: '#/components/schemas/V1AuthorizationRequestMeta/properties/language'
                redirectURI:
                  $ref: '#/components/schemas/V1AuthorizationRequestMeta/properties/redirectURI'

    V1AuthorizationRequestSubmissionAttributes:
      type: object
      allOf:
        - if:
            properties:
              requestType:
                const: ChangeOfEnergySupplierForOrganization
            required:
              - requestType
          then:
            properties:
              allowedChanges:
                not: {}
        - if:
            properties:
              requestType:
                const: MoveInAndChangeOfEnergySupplierForOrganization
            required:
              - requestType
          then:
            required:
              - allowedChanges
      required:
        - requestType
        - appliesTo
        - externalReference
      properties:
        requestType:
          type: string
          enum:
            - ChangeOfEnergySupplierForOrganization
            - MoveInAndChangeOfEnergySupplierForOrganization
        appliesTo:
          $ref: '#/components/schemas/V1AppliesTo'
        allowedChanges:
          $ref: '#/components/schemas/V1AllowedChanges'
        externalReference:
          $ref: '#/components/schemas/V1AuthorizationDocumentSubmissionAttributes/properties/externalReference'

    V1AuthorizationRequestMeta:
      type: object
      additionalProperties: false
      required:
        - language
      properties:
        language:
          $ref: '#/components/schemas/V1AuthorizationDocumentMeta/properties/language'
          description: Language requested for the authorization text presented in Min Side.
        redirectURI:
          type: string
          format: uri
          pattern: '^https://'

    V1AuthorizationRequestResource:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - id
            - type
            - attributes
            - meta
            - relationships
            - links
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              const: AuthorizationRequest
            attributes:
              type: object
              allOf:
                - $ref: '#/components/schemas/V1AuthorizationRequestSubmissionAttributes'
              unevaluatedProperties: false
              required:
                - status
                - createdAt
                - updatedAt
                - validTo
              properties:
                status:
                  type: string
                  enum:
                    - Pending
                    - Accepted
                    - Rejected
                    - Expired
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                validTo:
                  type: string
                  format: date-time
            meta:
              $ref: '#/components/schemas/V1AuthorizationRequestMeta'
            relationships:
              type: object
              additionalProperties: false
              required:
                - requestedFrom
                - requestedTo
                - requestedBy
                - authorizationGrant
              properties:
                requestedFrom:
                  $ref: '#/components/schemas/V1AgentRelationship'
                  description: Rights holder, equivalent to requestedFrom in the document flow.
                requestedTo:
                  $ref: '#/components/schemas/V1AgentRelationship'
                  description: Intended approver, equivalent to the intended signer in the document flow.
                requestedBy:
                  $ref: '#/components/schemas/V1AgentRelationship'
                  description: Authenticated requesting market party that will receive the permissions.
                approvedBy:
                  $ref: '#/components/schemas/V1SignedByRelationship'
                authorizationGrant:
                  $ref: '#/components/schemas/V1AuthorizationGrantRelationship'
                  description: >
                    Empty until acceptance, then contains all resulting grants. Links are
                    retained even if the grants later expire, are exhausted or are revoked.
            links:
              type: object
              additionalProperties: false
              required:
                - self
              properties:
                self:
                  type: string
                  format: uri-reference
                approval:
                  type: string
                  format: uri
                  pattern: '^https://'
          allOf:
            - if:
                properties:
                  attributes:
                    properties:
                      status:
                        const: Accepted
              then:
                properties:
                  relationships:
                    required:
                      - approvedBy
                    properties:
                      authorizationGrant:
                        properties:
                          data:
                            minItems: 1
              else:
                properties:
                  relationships:
                    properties:
                      approvedBy:
                        not: {}
                      authorizationGrant:
                        properties:
                          data:
                            maxItems: 0
            - if:
                properties:
                  attributes:
                    properties:
                      status:
                        const: Pending
              then:
                properties:
                  links:
                    required:
                      - approval
              else:
                properties:
                  links:
                    properties:
                      approval:
                        not: {}

    V1AuthorizationDocumentSubmission:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V1AuthorizationDocumentSubmissionData'

    V1AuthorizationDocumentSubmissionData:
      type: object
      additionalProperties: false
      required:
        - type
        - attributes
        - meta
      properties:
        type:
          type: string
          const: AuthorizationDocument
        attributes:
          $ref: '#/components/schemas/V1AuthorizationDocumentSubmissionAttributes'
        meta:
          $ref: '#/components/schemas/V1AuthorizationDocumentMeta'

    V1AuthorizationDocumentSubmissionAttributes:
      type: object
      allOf:
        - $ref: '#/components/schemas/V1AuthorizationDocumentScopeProfile'
      required:
        - documentType
        - appliesTo
        - externalReference
      properties:
        documentType:
          type: string
          description: >
            Selects the document-type profile that validates the requested scope and party identifiers.
          enum:
            - ChangeOfEnergySupplierForOrganization
            - MoveInAndChangeOfEnergySupplierForOrganization
        appliesTo:
          $ref: '#/components/schemas/V1AppliesTo'
        allowedChanges:
          $ref: '#/components/schemas/V1AllowedChanges'
        externalReference:
          type: string
          minLength: 1
          maxLength: 255
          description: Reference assigned by the requesting party to the underlying contract or process.

    V1AppliesTo:
      type: object
      additionalProperties: false
      required:
        - meteringPointId
      properties:
        meteringPointId:
          type: array
          minItems: 1
          uniqueItems: true
          description: Metering points to which the authorization applies.
          items:
            type: string
            minLength: 1
    V1AllowedChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Changes authorized for the listed resources.
      required:
        - validFrom
      properties:
        validFrom:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            format: date

    V1AuthorizationDocumentScopeProfile:
      allOf:
        - if:
            properties:
              documentType:
                const: ChangeOfEnergySupplierForOrganization
            required:
              - documentType
          then:
            properties:
              allowedChanges:
                not: {}
        - if:
            properties:
              documentType:
                const: MoveInAndChangeOfEnergySupplierForOrganization
            required:
              - documentType
          then:
            required:
              - allowedChanges

    V1AuthorizationDocumentMeta:
      type: object
      additionalProperties: false
      required:
        - requestedFrom
        - requestedTo
        - language
      properties:
        requestedFrom:
          type: string
          minLength: 1
        requestedTo:
          type: string
          minLength: 1
        language:
          type: string
          description: Language used for the generated authorization document.
          enum:
            - nb
            - nn
            - en

    V1AuthorizationDocumentResource:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - id
            - type
            - attributes
            - meta
            - relationships
            - links
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              const: AuthorizationDocument
            attributes:
              type: object
              additionalProperties: false
              allOf:
                - $ref: '#/components/schemas/V1AuthorizationDocumentScopeProfile'
              required:
                - documentType
                - appliesTo
                - externalReference
                - status
                - createdAt
                - updatedAt
                - validTo
              properties:
                documentType:
                  type: string
                  enum:
                    - ChangeOfEnergySupplierForOrganization
                    - MoveInAndChangeOfEnergySupplierForOrganization
                appliesTo:
                  $ref: '#/components/schemas/V1AppliesTo'
                allowedChanges:
                  $ref: '#/components/schemas/V1AllowedChanges'
                externalReference:
                  type: string
                  minLength: 1
                  maxLength: 255
                status:
                  type: string
                  enum:
                    - Pending
                    - Signed
                    - Rejected
                    - Expired
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                validTo:
                  type: string
                  format: date-time
            meta:
              type: object
              additionalProperties: false
              required:
                - language
              properties:
                language:
                  type: string
                  enum:
                    - nb
                    - nn
                    - en
            relationships:
              $ref: '#/components/schemas/V1AuthorizationDocumentRelationships'
            links:
              type: object
              additionalProperties: false
              required:
                - self
                - file
              properties:
                self:
                  type: string
                  format: uri-reference
                  example: /access/v1/authorization-documents/123e4567-e89b-12d3-a456-426614174000
                file:
                  type: string
                  format: uri-reference
                  example: /access/v1/authorization-documents/123e4567-e89b-12d3-a456-426614174000.pdf

    V1AuthorizationDocumentRelationships:
      type: object
      additionalProperties: false
      required:
        - requestedFrom
        - requestedTo
        - requestedBy
      properties:
        requestedFrom:
          $ref: '#/components/schemas/V1AgentRelationship'
        requestedTo:
          $ref: '#/components/schemas/V1AgentRelationship'
        requestedBy:
          $ref: '#/components/schemas/V1AgentRelationship'
        signedBy:
          $ref: '#/components/schemas/V1SignedByRelationship'
        authorizationGrant:
          $ref: '#/components/schemas/V1AuthorizationGrantRelationship'

    V1AgentRelationship:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - Person
                - Organization
                - MarketEntity
            id:
              type: string
              minLength: 1

    V1SignedByRelationship:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              const: Person
            id:
              type: string
              minLength: 1

    V1AuthorizationGrantRelationship:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - id
            properties:
              type:
                type: string
                const: AuthorizationGrant
              id:
                type: string
                format: uuid

    V1AuthorizationGrantResource:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V1AuthorizationGrant'

    V1AuthorizationGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - attributes
        - relationships
        - links
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: AuthorizationGrant
        attributes:
          $ref: '#/components/schemas/V1AuthorizationGrantAttributes'
        relationships:
          $ref: '#/components/schemas/V1AuthorizationGrantRelationships'
        links:
          $ref: '#/components/schemas/V1AuthorizationGrantLinks'

    V1AuthorizationGrantAttributes:
      type: object
      additionalProperties: false
      required:
        - status
        - grantedAt
        - validFrom
        - validTo
        - createdAt
        - updatedAt
        - scopes
      properties:
        status:
          type: string
          enum:
            - Active
            - Exhausted
            - Expired
            - Revoked
        grantedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/V1AuthorizationScope'

    V1AuthorizationScope:
      type: object
      additionalProperties: false
      required:
        - capability
        - resourceType
        - appliesTo
        - allowedChanges
      properties:
        capability:
          type: string
          enum:
            - Read
            - Write
        resourceType:
          type: string
        appliesTo:
          type: array
          items:
            $ref: '#/components/schemas/V1AuthorizationScopeConstraint'
        allowedChanges:
          type: array
          items:
            $ref: '#/components/schemas/V1AuthorizationScopeConstraint'

    V1AuthorizationScopeConstraint:
      type: object
      additionalProperties: false
      required:
        - attribute
        - value
      properties:
        attribute:
          type: string
          minLength: 1
        value:
          type: array
          minItems: 1
          items:
            type: string

    V1AuthorizationGrantRelationships:
      type: object
      additionalProperties: false
      required:
        - grantedFor
        - grantedBy
        - grantedTo
        - source
      properties:
        grantedFor:
          $ref: '#/components/schemas/V1AgentRelationship'
        grantedBy:
          $ref: '#/components/schemas/V1AgentRelationship'
        grantedTo:
          $ref: '#/components/schemas/V1AgentRelationship'
        source:
          $ref: '#/components/schemas/V1AuthorizationGrantSourceRelationship'

    V1AuthorizationGrantSourceRelationship:
      type: object
      description: >
        Evidence from which this grant was created: either a signed document or an
        accepted interactive request. The source technology does not change the meaning
        of the grant's parties or scopes.
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - AuthorizationDocument
                - AuthorizationRequest
            id:
              type: string
              format: uuid
        links:
          type: object
          additionalProperties: false
          properties:
            self:
              type: string
              format: uri-reference

    V1AuthorizationGrantLinks:
      type: object
      additionalProperties: false
      required:
        - self
      properties:
        self:
          type: string
          format: uri-reference

  parameters:
    UserAgent:
      name: User-Agent
      in: header
      required: true
      schema:
        type: string

    AuthorizationMaskinporten:
      name: Authorization
      in: header
      required: true
      description: Bearer Maskinporten token identifying the calling organization.
      schema:
        type: string

    AuthorizationMaskinportenOrEndUser:
      name: Authorization
      in: header
      required: true
      description: >
        Bearer token identifying the caller. This can be either a Maskinporten token
        or an end-user token, depending on the endpoint.
      schema:
        type: string

    AuthorizationMaskinportenOrEndUserOptional:
      name: Authorization
      in: header
      required: false
      description: >
        Optional bearer token identifying the caller. This can be either a Maskinporten token
        or an end-user token, depending on the endpoint.
      schema:
        type: string

    SenderGlnRequired:
      name: SenderGln
      in: header
      required: true
      description: GLN of the party issuing the request.
      schema:
        type: string

    SenderGlnOptional:
      name: SenderGln
      in: header
      required: false
      description: GLN of the party issuing the request.
      schema:
        type: string

    OnBehalfOfGlnOptional:
      name: OnBehalfOfGln
      in: header
      required: false
      description: >
        GLN of the organization on whose behalf the sender is acting,
        used in delegated Maskinporten flows.
      schema:
        type: string

  responses:
    400BadRequestError:
      description: >
        Bad request. The request body is invalid or missing required fields.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            badRequest:
              summary: Bad request error example
              value:
                errors:
                  - status: '400'
                    title: 'Bad Request'
                    detail: 'A required field is missing or invalid.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'

    401UnauthorizedError:
      description: >
        Unauthorized. The caller is not authenticated or the provided token is invalid or expired.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            unauthorized:
              summary: Unauthorized error example
              value:
                errors:
                  - status: '401'
                    title: 'Unauthorized'
                    detail: 'Authentication credentials are missing or invalid.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'

    403ForbiddenError:
      description: >
        Forbidden. The caller is authenticated but does not have permission to perform this operation.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            forbidden:
              summary: Forbidden error example
              value:
                errors:
                  - status: '403'
                    title: 'Forbidden'
                    detail: 'A detailed description for getting forbidden'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'

    404NotFoundError:
      description: >
        Not found. The requested resource does not exist or is not accessible to the caller.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            notFound:
              summary: Not found error example
              value:
                errors:
                  - status: '404'
                    title: 'Not Found'
                    detail: 'The requested resource could not be found.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'
    406NotAcceptableError:
      description: >
        Not Acceptable. The server cannot produce a response matching the list of acceptable
        values defined in the request's proactive content negotiation headers.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            notAcceptable:
              summary: Not acceptable error example
              value:
                errors:
                  - status: '406'
                    title: 'Not Acceptable'
                    detail: 'The requested media type is not supported.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'
    413ContentTooLargeError:
      description: >
        Content Too Large. The request body exceeds the maximum allowed size.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            contentTooLarge:
              summary: Content too large error example
              value:
                errors:
                  - status: '413'
                    title: 'Content Too Large'
                    detail: 'Signed PDF upload size is limited to 1 MB.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'
    409ConflictError:
      description: >
        Conflict. The request could not be completed due to a conflict with the current state
        of the resource.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            conflict:
              summary: Conflict error example
              value:
                errors:
                  - status: '409'
                    title: 'Conflict'
                    detail: 'An authorization document already exists for the specified parties and validity period.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'
    422UnprocessableEntityError:
      description: >
        Unprocessable Entity. The request was well-formed but could not be followed due to semantic errors.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            unprocessableEntity:
              summary: Unprocessable entity error example
              value:
                errors:
                  - status: '422'
                    title: 'Unprocessable Entity'
                    detail: 'The request could not be processed due to semantic errors.'
                meta:
                  createdAt: '2025-12-17T12:51:57+01:00'
            unsupportedDocumentType:
              summary: Unsupported document type
              value:
                errors:
                  - status: '422'
                    title: 'Unsupported document type'
                    detail: 'The authorization document type is not currently supported.'
                meta:
                  createdAt: '2025-12-17T12:51:57+01:00'
            unsupportedRequestType:
              summary: Unsupported request type
              value:
                errors:
                  - status: '422'
                    title: 'Unsupported request type'
                    detail: 'The authorization request type is not currently supported.'
                meta:
                  createdAt: '2025-12-17T12:51:57+01:00'
    415UnsupportedMediaTypeError:
      description: >
        Unsupported Media Type. The request body uses a media type the server or resource does not support.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            unsupportedMediaType:
              summary: Unsupported media type error example
              value:
                errors:
                  - status: '415'
                    title: 'Unsupported Media Type'
                    detail: 'The submitted content type is not supported.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'
    500InternalServerError:
      description: >
        Internal server error. An unexpected error occurred while processing the request.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-error.schema.json'
          examples:
            internalServerError:
              summary: Internal server error example
              value:
                errors:
                  - status: '500'
                    title: 'Internal Server Error'
                    detail: 'An unexpected error occurred.'
                    meta:
                      createdAt: '2025-12-17T12:51:57+01:00'

    MetaResponse:
      description: >
        Metadata response for informational purposes, typically returned from successful
        cancel operations.
      content:
        application/vnd.api+json:
          schema:
            $ref: './schemas/json-api-meta.schema.json'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
