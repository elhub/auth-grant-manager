change_of_supplier.document_title=Stadfest straumavtale - Leverandørskifte
change_of_supplier.intro_1=Reguleringsmyndigheita for Energi (RME) har pålagd Elhub å kontrollere at det ligg føre gyldig straumavtale før innflytting og skifte av straumleverandør (leverandørskifte).
change_of_supplier.bullet_1=For å få gjennomført leverandørskifte må straumavtalen stadfestast innan 4 veker.
change_of_supplier.bullet_2=Om du ikkje stadfestar straumavtalen blir leverandørskifte ikkje gjennomført.
change_of_supplier.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikkje stadfestinga brukast fleire gongar av straumleverandøren.
