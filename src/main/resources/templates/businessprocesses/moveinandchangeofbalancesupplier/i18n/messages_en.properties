move_in.document_title=Confirm electricity supply agreement - Move-in and change of supplier
move_in.intro_1=The Norwegian Regulatory Authority (RME) has instructed Elhub to verify that there is a valid electricity supply agreement in place prior to move-in and change of electricity supplier (supplier change).
move_in.bullet_1=In order to complete the move-in and supplier change, the electricity supply agreement must be confirmed within four weeks.
move_in.bullet_2=If you do not confirm the electricity supply agreement, the move-in and supplier change will not be completed.
move_in.bullet_3=Once the move-in and supplier change process has been completed, the confirmation cannot be reused by the electricity supplier.
move_in.organization_document_title=Confirmation of electricity supply agreement - Move-in and change of supplier
move_in.organization_intro_1=The Norwegian Regulatory Authority (RME) has instructed Elhub to verify that there is a valid electricity supply agreement in place before move-in and change of electricity supplier (supplier change).
move_in.organization_bullet_1=To complete the move-in and change of supplier, the request must be confirmed within four weeks.
move_in.organization_bullet_2=If the electricity supply agreement is not confirmed, the move-in and change of supplier will not be completed.
move_in.organization_bullet_elhub_minside=This document will be available to the electricity customer on Elhub My Page.
move_in.organization_more_information=You can find more information about confirming an electricity supply agreement on the Elhub website.
