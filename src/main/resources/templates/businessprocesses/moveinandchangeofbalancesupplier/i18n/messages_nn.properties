move_in.document_title=Stadfest straumavtale - Innflytting og leverandørskifte
move_in.intro_1=Reguleringsmyndigheita for Energi (RME) har pålagd Elhub å kontrollere at det ligg føre gyldig straumavtale før innflytting og skifte av straumleverandør (leverandørskifte).
move_in.bullet_1=For å få gjennomført innflytting og leverandørskifte må straumavtalen stadfestast innan 4 veker.
move_in.bullet_2=Om du ikkje stadfestar straumavtalen blir innflytting og leverandørskifte ikkje gjennomført.
move_in.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikkje stadfestinga brukast fleire gongar av straumleverandøren.
move_in.organization_document_title=Stadfesting av straumavtale - Innflytting og leverandørskifte
move_in.organization_intro_1=Reguleringsmyndigheita for Energi (RME) har pålagd Elhub å kontrollere at det ligg føre gyldig straumavtale før innflytting og skifte av straumleverandør (leverandørskifte).
move_in.organization_bullet_1=For å få gjennomført innflytting og leverandørskifte må førespurnaden stadfestast innan 4 veker.
move_in.organization_bullet_2=Om straumavtalen ikkje blir stadfesta, blir innflytting og leverandørskiftet ikkje gjennomført.
move_in.organization_bullet_elhub_minside=Dette dokumentet vil vere tilgjengeleg for straumkunden på Elhub Mi Side.
move_in.organization_more_information=Du finn meir informasjon om stadfesting av straumavtale på heimesida til Elhub.
