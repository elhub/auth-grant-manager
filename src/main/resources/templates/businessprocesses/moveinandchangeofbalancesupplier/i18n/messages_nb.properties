move_in.document_title=Avtalebekreftelse - Innflytting og leverandørskifte
move_in.intro_1=Reguleringsmyndigheten for Energi (RME) har pålagt Elhub å kontrollere at det foreligger gyldig strømavtale for innflytting og skifte av strømleverandør (leverandørskifte).
move_in.bullet_1=For å få gjennomført innflytting og leverandørskifte må strømavtalen bekreftes innen 4 uker.
move_in.bullet_2=Om du ikke bekrefter strømavtalen gjennomføres ikke innflytting og leverandørskiftet.
move_in.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikke bekreftelsen benyttes flere ganger av strømleverandøren.
move_in.organization_document_title=Avtalebekreftelse - Innflytting og leverandørskifte
move_in.organization_intro_1=Reguleringsmyndigheten for Energi (RME) har pålagt Elhub å kontrollere at det foreligger gyldig strømavtale før innflytting og skifte av strømleverandør (leverandørskifte).
move_in.organization_bullet_1=For å få gjennomført innflytting og leverandørskifte må forespørselen bekreftes innen 4 uker.
move_in.organization_bullet_2=Om strømavtalen ikke bekreftes gjennomføres ikke innflytting og leverandørskiftet.
move_in.organization_bullet_elhub_minside=Dette dokumentet vil være tilgjengelig for strømkunden på Elhub Min Side.
move_in.organization_more_information=Mer informasjon om bekreftelse av strømavtale finner du på Elhub sin hjemmeside.
