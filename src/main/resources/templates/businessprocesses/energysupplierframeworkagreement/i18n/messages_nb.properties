energy_supplier_framework_agreement.document_title=Avtalebekreftelse - Rammeavtale
energy_supplier_framework_agreement.ongoing_agreement=Løpende avtale
energy_supplier_framework_agreement.intro=Reguleringsmyndigheten for energi (RME) har pålagt Elhub å kontrollere at det foreligger gyldig strømavtale før innflytting og skifte av strømleverandør (leverandørskifte).
energy_supplier_framework_agreement.signing_confirmation=Ved å signere dette dokumentet bekrefter du på vegne av organisasjonen at organisasjonen har inngått rammeavtalen som det vises til over, og at avtalen er signert av en person med nødvendig fullmakt til å representere organisasjonen.
energy_supplier_framework_agreement.bullet_1=For å kunne benytte rammeavtalen ved fremtidige innflyttinger og leverandørskifter må avtalen bekreftes innen 4 uker.
energy_supplier_framework_agreement.bullet_2=Om strømavtalen ikke bekreftes gjennomføres ikke innflytting og leverandørskiftet.
energy_supplier_framework_agreement.bullet_3=Bekreftelsen er ikke knyttet til bestemte målepunkter og kan benyttes ved flere innflyttinger og leverandørskifter innenfor rammeavtalens gyldighetsperiode.
energy_supplier_framework_agreement.bullet_4=For løpende rammeavtaler kan bekreftelsen trekkes tilbake av organisasjonen på Elhub Min Side.
energy_supplier_framework_agreement.bullet_5=Dette dokumentet vil være tilgjengelig for strømkunden på Elhub Min Side.
energy_supplier_framework_agreement.more_information=Mer informasjon om bekreftelse av strømavtaler finnes på Elhubs hjemmeside.
