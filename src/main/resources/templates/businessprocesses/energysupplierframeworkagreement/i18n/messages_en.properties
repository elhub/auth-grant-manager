energy_supplier_framework_agreement.document_title=Framework agreement confirmation
energy_supplier_framework_agreement.ongoing_agreement=Ongoing agreement
energy_supplier_framework_agreement.intro=The Norwegian Regulatory Authority for Energy (RME) has instructed Elhub to verify that a valid electricity supply agreement is in place before move-in and a change of electricity supplier (supplier change).
energy_supplier_framework_agreement.signing_confirmation=By signing this document on behalf of the organization, you confirm that the organization has entered into the framework agreement referenced above and that it has been signed by a person with the necessary authority to represent the organization.
energy_supplier_framework_agreement.bullet_1=To use the framework agreement for future move-ins and supplier changes, the agreement must be confirmed within four weeks.
energy_supplier_framework_agreement.bullet_2=If the electricity supply agreement is not confirmed, the move-in and supplier change will not be completed.
energy_supplier_framework_agreement.bullet_3=This confirmation is not tied to specific metering points and can be used for multiple move-ins and supplier changes during the validity period of the framework agreement.
energy_supplier_framework_agreement.bullet_4=For ongoing framework agreements, the organization can withdraw the confirmation on Elhub My Page.
energy_supplier_framework_agreement.bullet_5=This document will be available to the electricity customer on Elhub My Page.
energy_supplier_framework_agreement.more_information=More information about confirming electricity supply agreements is available on Elhub's website.
