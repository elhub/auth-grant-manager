change_of_supplier.document_title=Stadfest straumavtale - Leverandørskifte
change_of_supplier.intro_1=Reguleringsmyndigheita for Energi (RME) har pålagd Elhub å kontrollere at det ligg føre gyldig straumavtale før innflytting og skifte av straumleverandør (leverandørskifte).
change_of_supplier.bullet_1=For å få gjennomført leverandørskifte må straumavtalen stadfestast innan 4 veker.
change_of_supplier.bullet_2=Om du ikkje stadfestar straumavtalen blir leverandørskifte ikkje gjennomført.
change_of_supplier.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikkje stadfestinga brukast fleire gongar av straumleverandøren.

move_in.document_title=Stadfest straumavtale - Innflytting og leverandørskifte
move_in.intro_1=Reguleringsmyndigheita for Energi (RME) har pålagd Elhub å kontrollere at det ligg føre gyldig straumavtale før innflytting og skifte av straumleverandør (leverandørskifte).
move_in.bullet_1=For å få gjennomført innflytting og leverandørskifte må straumavtalen stadfestast innan 4 veker.
move_in.bullet_2=Om du ikkje stadfestar straumavtalen blir innflytting og leverandørskifte ikkje gjennomført.
move_in.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikkje stadfestinga brukast fleire gongar av straumleverandøren.

framework_agreement.document_title=Avtalestadfesting - Rammeavtale
framework_agreement.ongoing_agreement=Løpande avtale
framework_agreement.intro=Reguleringsmyndigheita for energi (RME) har pålagt Elhub å kontrollere at det ligg føre gyldig straumavtale før innflytting og skifte av straumleverandør (leverandørskifte).
framework_agreement.signing_confirmation=Ved å signere dette dokumentet stadfestar du på vegner av organisasjonen at organisasjonen har inngått rammeavtalen som det blir vist til over, og at avtalen er signert av ein person med naudsynt fullmakt til å representere organisasjonen.
framework_agreement.bullet_1=For å kunne nytte rammeavtalen ved framtidige innflyttingar og leverandørskifte må avtalen stadfestast innan 4 veker.
framework_agreement.bullet_2=Om straumavtalen ikkje blir stadfesta, blir ikkje innflyttinga og leverandørskiftet gjennomført.
framework_agreement.bullet_3=Stadfestinga er ikkje knytt til bestemte målepunkt og kan knyttast ved fleire innflyttingar og leverandørskifte innanfor gyldigheitsperioden til rammeavtalen.
framework_agreement.bullet_4=For løpande rammeavtalar kan stadfestinga trekkjast tilbake av organisasjonen på Elhub Mi Side.
framework_agreement.bullet_5=Dette dokumentet vil vere tilgjengeleg for straumkunden på Elhub Mi Side.
framework_agreement.more_information=Meir informasjon om stadfesting av straumavtalar finn du på heimesida til Elhub.

common.intro_signing_confirmation=Ved å signere dette dokumentet stadfestar du at du har inngått straumavtalen det blir vist til over.
common.bullet_elhub_minside=Dette dokumentet vil vere tilgjengeleg for straumkundar på Elhub Mi Side.
common.more_information=Du finn meir informasjon om stadfesting av straumavtale på heimesida til Elhub.
