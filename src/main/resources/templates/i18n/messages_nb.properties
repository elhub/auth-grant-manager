change_of_supplier.document_title=Avtalebekreftelse - Leverandørskifte
change_of_supplier.intro_1=Reguleringsmyndigheten for Energi (RME) har pålagt Elhub å kontrollere at det foreligger gyldig strømavtale før innflytting og skifte av strømleverandør (leverandørskifte).
change_of_supplier.bullet_1=For å få gjennomført leverandørskifte må strømavtalen bekreftes innen 4 uker.
change_of_supplier.bullet_2=Om du ikke bekrefter strømavtalen gjennomføres ikke leverandørskiftet.
change_of_supplier.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikke bekreftelsen benyttes flere ganger av strømleverandøren.

move_in.document_title=Avtalebekreftelse - Innflytting og leverandørskifte
move_in.intro_1=Reguleringsmyndigheten for Energi (RME) har pålagt Elhub å kontrollere at det foreligger gyldig strømavtale for innflytting og skifte av strømleverandør (leverandørskifte).
move_in.bullet_1=For å få gjennomført innflytting og leverandørskifte må strømavtalen bekreftes innen 4 uker.
move_in.bullet_2=Om du ikke bekrefter strømavtalen gjennomføres ikke innflytting og leverandørskiftet.
move_in.bullet_3=Når innflytting og leverandørskifteprosessen er gjennomført kan ikke bekreftelsen benyttes flere ganger av strømleverandøren.

framework_agreement.document_title=Avtalebekreftelse - Rammeavtale
framework_agreement.ongoing_agreement=Løpende avtale
framework_agreement.intro=Reguleringsmyndigheten for energi (RME) har pålagt Elhub å kontrollere at det foreligger gyldig strømavtale før innflytting og skifte av strømleverandør (leverandørskifte).
framework_agreement.signing_confirmation=Ved å signere dette dokumentet bekrefter du på vegne av organisasjonen at organisasjonen har inngått rammeavtalen som det vises til over, og at avtalen er signert av en person med nødvendig fullmakt til å representere organisasjonen.
framework_agreement.bullet_1=For å kunne benytte rammeavtalen ved fremtidige innflyttinger og leverandørskifter må avtalen bekreftes innen 4 uker.
framework_agreement.bullet_2=Om strømavtalen ikke bekreftes gjennomføres ikke innflytting og leverandørskiftet.
framework_agreement.bullet_3=Bekreftelsen er ikke knyttet til bestemte målepunkter og kan benyttes ved flere innflyttinger og leverandørskifter innenfor rammeavtalens gyldighetsperiode.
framework_agreement.bullet_4=For løpende rammeavtaler kan bekreftelsen trekkes tilbake av organisasjonen på Elhub Min Side.
framework_agreement.bullet_5=Dette dokumentet vil være tilgjengelig for strømkunden på Elhub Min Side.
framework_agreement.more_information=Mer informasjon om bekreftelse av strømavtaler finnes på Elhubs hjemmeside.

common.intro_signing_confirmation=Ved å signere dette dokumentet bekrefter du at du har inngått strømavtalen som det vises til over.
common.bullet_elhub_minside=Dette dokumentet vil være tilgjengelig for strømkunder på Elhub Min Side.
common.more_information=Mer informasjon om bekreftelse av strømavtale finnes på Elhub sin hjemmeside.
