change_of_supplier.document_title=Confirm electricity supply agreement - Change of supplier
change_of_supplier.intro_1=The Norwegian Regulatory Authority (RME) has instructed Elhub to verify that there is a valid electricity supply agreement in place prior to move-in and change of electricity supplier (supplier change).
change_of_supplier.bullet_1=In order to complete the supplier change, the electricity supply agreement must be confirmed within four weeks.
change_of_supplier.bullet_2=If you do not confirm the electricity supply agreement, the supplier change will not be completed.
change_of_supplier.bullet_3=Once the supplier change process has been completed, the confirmation cannot be reused by the electricity supplier.

move_in.document_title=Confirm electricity supply agreement - Move-in and change of supplier
move_in.intro_1=The Norwegian Regulatory Authority (RME) has instructed Elhub to verify that there is a valid electricity supply agreement in place prior to move-in and change of electricity supplier (supplier change).
move_in.bullet_1=In order to complete the move-in and supplier change, the electricity supply agreement must be confirmed within four weeks.
move_in.bullet_2=If you do not confirm the electricity supply agreement, the move-in and supplier change will not be completed.
move_in.bullet_3=Once the move-in and supplier change process has been completed, the confirmation cannot be reused by the electricity supplier.

framework_agreement.document_title=Framework agreement confirmation
framework_agreement.ongoing_agreement=Ongoing agreement
framework_agreement.intro=The Norwegian Regulatory Authority for Energy (RME) has instructed Elhub to verify that a valid electricity supply agreement is in place before move-in and a change of electricity supplier (supplier change).
framework_agreement.signing_confirmation=By signing this document on behalf of the organization, you confirm that the organization has entered into the framework agreement referenced above and that it has been signed by a person with the necessary authority to represent the organization.
framework_agreement.bullet_1=To use the framework agreement for future move-ins and supplier changes, the agreement must be confirmed within four weeks.
framework_agreement.bullet_2=If the electricity supply agreement is not confirmed, the move-in and supplier change will not be completed.
framework_agreement.bullet_3=This confirmation is not tied to specific metering points and can be used for multiple move-ins and supplier changes during the validity period of the framework agreement.
framework_agreement.bullet_4=For ongoing framework agreements, the organization can withdraw the confirmation on Elhub My Page.
framework_agreement.bullet_5=This document will be available to the electricity customer on Elhub My Page.
framework_agreement.more_information=More information about confirming electricity supply agreements is available on Elhub's website.

common.intro_signing_confirmation=By signing this document, you confirm that you have accepted the electricity supply agreement referenced above.
common.bullet_elhub_minside=This document will be available to electricity customers on the Elhub My Page.
common.more_information=More information about confirming an electricity supply agreement is available on the Elhub website.
